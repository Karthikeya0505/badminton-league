<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVS Silver - Players</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #24124e 0%, #3e1f7a 100%);
            min-height: 100vh;
            padding: 80px 20px 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 1000;
            font-size: 0.95rem;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }

        .team-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .team-header h1 {
            color: #c0c0c0;
            font-size: clamp(2rem, 5vw, 2.8rem);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
            position: relative;
            z-index: 1;
        }

        .search-box {
            width: 100%;
            padding: 15px 50px 15px 50px;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transition: all 0.3s ease;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-box:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        .clear-search {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }

        .search-stats {
            text-align: center;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .search-stats.hidden {
            display: none;
        }

        .players-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .player-card.hidden {
            display: none;
        }

        .player-card-main {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 90px;
        }

        .player-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .player-photo:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .player-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .player-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #c0c0c0;
            line-height: 1.2;
        }

        .player-surname {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.2;
        }

        .player-grade {
            font-size: 0.9rem;
            color: #a3ff3c;
            font-weight: 600;
            margin-top: 2px;
        }

        .highlight {
            background-color: rgba(255, 215, 0, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .player-details-toggle {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .player-details-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .player-details-toggle::before {
            content: '';
            width: 10px;
            height: 10px;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg);
            transition: transform 0.3s ease;
            margin-top: -3px;
        }

        .player-details-toggle.expanded::before {
            transform: rotate(-135deg);
            margin-top: 3px;
        }

        .player-details-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .player-details-container.show {
            max-height: 500px;
            padding: 15px;
        }

        .player-details-container p {
            margin: 8px 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .player-details-container strong {
            color: #c0c0c0;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.7);
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-image {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-caption {
            text-align: center;
            color: #fff;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body {
                padding: 60px 15px 30px;
            }

            .players-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="../teams.html" class="back-link">← Back to Teams</a>

    <div class="team-header">
        <h1>💠 Blue Stone Blasters</h1>
    </div>

    <div class="search-container">
        <input type="text" id="searchBox" class="search-box" placeholder="Search players by name...">
        <button class="clear-search" id="clearSearch">×</button>
    </div>

    <div class="search-stats hidden" id="searchStats">
        Showing <span id="resultCount">0</span> of <span id="totalCount">0</span> players
    </div>

    <div class="players-container" id="playersContainer">
        <div class="no-results" id="noResults">
            <h3>No players found</h3>
            <p>Try adjusting your search terms.</p>
        </div>
    </div>

    <div id="photoModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <img id="modalImage" class="modal-image" src="" alt="">
            <div id="modalCaption" class="modal-caption"></div>
        </div>
    </div>

    <script>
        const playerData = [
    { firstName: "Karthikeya", lastName: "Atmakuri", playStyle: "RIGHT HAND", city: "Vijayawda", mobile: "8179796013", age: 23, grade: "B" },
    { firstName: "Prasad", lastName: "Batchu", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "7893068777", age: 51, grade: "B" },
    { firstName: "RAGHAVENDRA RAO", lastName: "D", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "8885814382", age: 36, grade: "B+" },
    { firstName: "Tarun", lastName: "Dupaguntla", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "7799926667", age: 22, grade: "B" },
    { firstName: "Srinivasarao", lastName: "Dupaguntla", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "9866840340", age: 45, grade: "B" },
    { firstName: "Nihar", lastName: "Kanigicherla", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "9703133327", age: 33, grade: "A" },
    { firstName: "Manikanta", lastName: "Mylavarapu", playStyle: "RIGHT HAND", city: "Nandigama", mobile: "6309104984", age: 23, grade: "A+" },
    { firstName: "Anil Kumar", lastName: "Peruri", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "9603889869", age: 38, grade: "B" },
    { firstName: "Mahesh", lastName: "Rachapudi", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "9542289833", age: 24, grade: "B" },
    { firstName: "S V MAHESH KUMAR", lastName: "Sriram", playStyle: "RIGHT HAND", city: "Vijayawada", mobile: "9848032853", age: 40, grade: "B+" },
    { firstName: "Lakshmi Narayana", lastName: "Garre", playStyle: "RIGHT HAND", city: "Suryapeta", mobile: "7396320010", age: 42, grade: "B+" }
];


        const DEFAULT_PHOTO_URL = "https://static.vecteezy.com/system/resources/previews/045/892/686/non_2x/badminton-player-icon-image-symbol-illustration-vector.jpg";

        function toggleDetails(button) {
            const targetId = button.getAttribute('data-target');
            const targetElement = document.getElementById(targetId);

            document.querySelectorAll('.player-details-container.show').forEach(container => {
                if (container !== targetElement) {
                    container.classList.remove('show');
                    container.style.maxHeight = null;
                    const toggle = container.parentElement.querySelector('.player-details-toggle.expanded');
                    if (toggle) toggle.classList.remove('expanded');
                }
            });

            if (targetElement.classList.contains('show')) {
                targetElement.classList.remove('show');
                button.classList.remove('expanded');
                targetElement.style.maxHeight = null;
            } else {
                targetElement.classList.add('show');
                button.classList.add('expanded');
                targetElement.style.maxHeight = targetElement.scrollHeight + "px";
            }
        }

        function renderPlayers(data) {
            const playersContainer = document.getElementById('playersContainer');
            const noResults = document.getElementById('noResults');
            
            const staticCards = Array.from(playersContainer.querySelectorAll('.player-card'));
            staticCards.forEach(card => card.remove());

            data.forEach((player, index) => {
                const fullName = `${player.firstName} ${player.lastName}`;
                const dataName = fullName.toLowerCase().replace(/[^a-z0-9]/g, ''); 
                
                const playerCard = document.createElement('div');
                playerCard.className = 'player-card';
                playerCard.setAttribute('data-name', dataName);
                
                playerCard.innerHTML = `
                    <div class="player-card-main">
                        <img src="${DEFAULT_PHOTO_URL}" 
                            alt="${fullName}" 
                            class="player-photo" 
                            onclick="openModal(this, '${fullName.replace(/'/g, "\\'")}')">
                        <div class="player-info">
                            <div class="player-name">${player.firstName}</div>
                            <div class="player-surname">${player.lastName}</div>
                            <div class="player-grade">Grade: ${player.grade}</div>
                        </div>
                        <button class="player-details-toggle" 
                            data-target="details-${index}" 
                            onclick="toggleDetails(this)"></button>
                    </div>
                    
                    <div class="player-details-container" id="details-${index}">
                        <p><b>Age:</b> ${player.age || 'N/A'}</p>
                        <p><b>City:</b> ${player.city || 'N/A'}</p>
                        <p><b>Play Style:</b> ${player.playStyle || 'N/A'}</p>
                        <p><b>Mobile:</b> ${player.mobile || 'N/A'}</p>
                    </div>
                `;
                
                playersContainer.insertBefore(playerCard, noResults);
            });
        }

        class PlayerSearch {
            constructor() {
                this.searchBox = document.getElementById('searchBox');
                this.clearButton = document.getElementById('clearSearch');
                this.playersContainer = document.getElementById('playersContainer');
                this.searchStats = document.getElementById('searchStats');
                this.noResults = document.getElementById('noResults');
                this.resultCount = document.getElementById('resultCount');
                this.totalCount = document.getElementById('totalCount');
                
                this.playerCards = Array.from(document.querySelectorAll('.player-card'));
                this.originalPlayerNames = new Map();
                
                this.init();
            }
            
            init() {
                this.playerCards.forEach(card => {
                    const firstName = card.querySelector('.player-name').textContent.trim();
                    const lastName = card.querySelector('.player-surname').textContent.trim();
                    const fullName = `${firstName} ${lastName}`;
                    this.originalPlayerNames.set(card, {firstName, lastName, fullName});
                });
                
                this.totalCount.textContent = this.playerCards.length;
                this.resultCount.textContent = this.playerCards.length;
                
                this.searchBox.addEventListener('input', () => this.handleSearch());
                this.searchBox.addEventListener('keyup', (e) => {
                    if (e.key === 'Escape') this.clearSearch();
                });
                
                this.clearButton.addEventListener('click', () => this.clearSearch());
                this.searchBox.addEventListener('input', () => {
                    this.clearButton.style.display = this.searchBox.value ? 'flex' : 'none';
                });
            }
            
            handleSearch() {
                const searchTerm = this.searchBox.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    this.showAllPlayers();
                    return;
                }
                
                let visibleCount = 0;
                
                this.playerCards.forEach(card => {
                    const originalData = this.originalPlayerNames.get(card);
                    const playerName = originalData.fullName.toLowerCase();
                    const firstNameElement = card.querySelector('.player-name');
                    const lastNameElement = card.querySelector('.player-surname');
                    
                    if (playerName.includes(searchTerm)) {
                        card.classList.remove('hidden');
                        visibleCount++;
                        
                        firstNameElement.innerHTML = this.highlightText(originalData.firstName, searchTerm);
                        lastNameElement.innerHTML = this.highlightText(originalData.lastName, searchTerm);
                    } else {
                        card.classList.add('hidden');
                        firstNameElement.textContent = originalData.firstName;
                        lastNameElement.textContent = originalData.lastName;
                    }
                });
                
                this.updateSearchStats(visibleCount, searchTerm);
                this.toggleNoResults(visibleCount === 0);
            }
            
            highlightText(text, searchTerm) {
                if (!searchTerm) return text;
                const regex = new RegExp(`(${searchTerm})`, 'gi');
                return text.replace(regex, '<span class="highlight">$1</span>');
            }
            
            updateSearchStats(visibleCount, searchTerm) {
                this.resultCount.textContent = visibleCount;
                this.searchStats.classList.toggle('hidden', !searchTerm);
            }
            
            toggleNoResults(show) {
                this.noResults.style.display = show ? 'block' : 'none';
            }
            
            showAllPlayers() {
                this.playerCards.forEach(card => {
                    card.classList.remove('hidden');
                    const originalData = this.originalPlayerNames.get(card);
                    card.querySelector('.player-name').textContent = originalData.firstName;
                    card.querySelector('.player-surname').textContent = originalData.lastName;
                });
                
                this.searchStats.classList.add('hidden');
                this.toggleNoResults(false);
            }
            
            clearSearch() {
                this.searchBox.value = '';
                this.clearButton.style.display = 'none';
                this.showAllPlayers();
                this.searchBox.focus();
            }
        }

        function openModal(imgElement, playerName) {
            const modal = document.getElementById('photoModal');
            const modalImage = document.getElementById('modalImage');
            const modalCaption = document.getElementById('modalCaption');

            modalImage.src = imgElement.src;
            modalImage.alt = imgElement.alt;
            modalCaption.textContent = playerName;

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('photoModal');
            modal.classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('photoModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderPlayers(playerData);
            new PlayerSearch();
        });
    </script>
</body>
</html>
